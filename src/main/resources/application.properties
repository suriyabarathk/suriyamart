spring.application.name=suriya-mart
server.port=8082

# ==============================
# MySQL DATABASE SETTINGS
# ==============================
# Change DB_USERNAME / DB_PASSWORD if your MySQL login is different.
# You can also set environment variables with these names.
spring.datasource.url=jdbc:mysql://localhost:3306/suriya_mart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create tables and demo accounts automatically when Spring Boot starts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Helpful during college-project development.
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true
